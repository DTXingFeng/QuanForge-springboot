# ===== Web 服务配置 =====
server:
  port: 40702

spring:
  application:
    name: QuanForge-springboot
  # 本地私有配置（如真实加密密钥），文件在 .gitignore 中，不存在也不报错
  config:
    import: "optional:application-local.yaml"
  # 调度线程池：默认 1 线程——任何一个 @Scheduled 任务挂死（如无超时的 HTTP 调用）
  # 会饿死其余全部任务（盯盘/纸面结算/TG轮询）。扩到 3：单任务挂死只影响自身。
  task:
    scheduling:
      pool:
        size: 3

  # ===== SQLite 数据源配置 =====
  datasource:
    # SQLite 为文件型数据库；开启 WAL 模式以提升读并发
    url: jdbc:sqlite:data/quanforge.db?journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    username:
    password:
    hikari:
      # SQLite WAL 支持多读单写：1 连接会让长任务（历史下载）饿死正常调度（盯盘/TG轮询）——提到 2
      maximum-pool-size: 2
      minimum-idle: 1

  # ===== JPA / Hibernate 配置 =====
  jpa:
    # SQLite 方言位于 hibernate-community-dialects 包
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # 开发阶段自动根据实体建表/更新表结构
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    # show-sql 曾在生产开着：每分钟扫描+TG轮询把 SQL 打进文件日志，
    # 两个月刷出 858MB。生产一律关掉，排查时再临时开。
    show-sql: false
    open-in-view: false

# ===== 加密配置 =====
app:
  crypto:
    # AES-256 主密钥（Base64，32 字节）。此处为随机示例值，仅保证开箱即用；
    # 生产/自用请务必覆盖：环境变量 APP_CRYPTO_KEY，或 gitignore 掉的 application-local.yaml
    key: ${APP_CRYPTO_KEY:6s2xvkv0JXhQ6s+uysNaZc7WPQUJgnl5qzHKGyDA1eA=}
